name: Publish target config

# Single source of truth for which S3 bucket (and credentials) packages are published to.
# The publish action stays infrastructure-publish-action@v1 (pinned SHA); only the target bucket changes.
#
# The target is selected by the repository variable PUBLISH_VERSION (v1 | v2), defaulting to v1 when unset:
#   v1 -> legacy buckets (nr-downloads-ohai-staging / nr-downloads-main)
#   v2 -> batch buckets  (nr-downloads-ohai-batch-staging / nr-downloads-ohai-batch-prod)
#
# Rollback: set the repository variable PUBLISH_VERSION back to v1 (or delete it). No code change needed.
# Before flipping in either direction, sync the buckets so the target repository contains every release
# published to the other one.

on:
  workflow_call:
    inputs:
      ENV:
        description: 'Environment to publish to: staging | production'
        required: true
        type: string
    outputs:
      publish_version:
        description: 'Selected bucket set: v1 (legacy) | v2 (batch)'
        value: ${{ jobs.config.outputs.publish_version }}
      aws_s3_bucket_name:
        value: ${{ jobs.config.outputs.aws_s3_bucket_name }}
      aws_s3_lock_bucket_name:
        value: ${{ jobs.config.outputs.aws_s3_lock_bucket_name }}
      aws_region:
        description: 'AWS region of the publish bucket: us-east-1 (v1) | us-east-2 (v2)'
        value: ${{ jobs.config.outputs.aws_region }}
      aws_s3_lock_bucket_region:
        description: 'AWS region of the lock bucket (us-east-1 for both v1 and v2)'
        value: ${{ jobs.config.outputs.aws_s3_lock_bucket_region }}
      access_point_host:
        value: ${{ jobs.config.outputs.access_point_host }}
      repo_endpoint:
        description: 'Repository endpoint the E2E tests install from'
        value: ${{ jobs.config.outputs.repo_endpoint }}

permissions:
  contents: read

jobs:
  config:
    name: Resolve publish target
    runs-on: ubuntu-24.04
    outputs:
      publish_version: ${{ steps.resolve.outputs.publish_version }}
      aws_s3_bucket_name: ${{ steps.resolve.outputs.aws_s3_bucket_name }}
      aws_s3_lock_bucket_name: ${{ steps.resolve.outputs.aws_s3_lock_bucket_name }}
      aws_region: ${{ steps.resolve.outputs.aws_region }}
      aws_s3_lock_bucket_region: ${{ steps.resolve.outputs.aws_s3_lock_bucket_region }}
      access_point_host: ${{ steps.resolve.outputs.access_point_host }}
      repo_endpoint: ${{ steps.resolve.outputs.repo_endpoint }}
    steps:
      - name: Resolve publish target
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.ENV }}
          VERSION_VAR: ${{ vars.PUBLISH_VERSION }}
        run: |
          version="${VERSION_VAR:-v1}"

          case "${version}" in
            v1|v2) ;;
            *) echo "::error::PUBLISH_VERSION must be v1 or v2, got '${version}'"; exit 1 ;;
          esac

          # v1 buckets are in us-east-1, v2 (batch) buckets are in us-east-2. The shared lock buckets stay in us-east-1.
          lock_bucket_region="us-east-1"
          case "${version}" in
            v1) region="us-east-1" ;;
            v2) region="us-east-2" ;;
          esac

          # access_point_host is written into the apt mirror source and the generated .repo files, so v2 must
          # use an explicit URL for its own batch bucket (the "staging"/"production" aliases resolve to the legacy buckets).
          # The lock buckets are intentionally shared by v1 and v2 so concurrent publishes to either set serialize.
          case "${TARGET_ENV}-${version}" in
            staging-v1)
              bucket="nr-downloads-ohai-staging"
              lock_bucket="onhost-ci-lock-staging"
              access_point_host="staging"
              ;;
            staging-v2)
              bucket="nr-downloads-ohai-batch-staging"
              lock_bucket="onhost-ci-lock-staging"
              access_point_host="https://nr-downloads-ohai-batch-staging.s3.amazonaws.com"
              ;;
            production-v1)
              bucket="nr-downloads-main"
              lock_bucket="onhost-ci-lock"
              access_point_host="production"
              ;;
            production-v2)
              bucket="nr-downloads-ohai-batch-prod"
              lock_bucket="onhost-ci-lock"
              access_point_host="https://nr-downloads-ohai-batch-prod.s3.amazonaws.com"
              ;;
            *)
              echo "::error::ENV must be staging or production, got '${TARGET_ENV}'"
              exit 1
              ;;
          esac

          {
            echo "publish_version=${version}"
            echo "aws_s3_bucket_name=${bucket}"
            echo "aws_s3_lock_bucket_name=${lock_bucket}"
            echo "aws_region=${region}"
            echo "aws_s3_lock_bucket_region=${lock_bucket_region}"
            echo "access_point_host=${access_point_host}"
            echo "repo_endpoint=https://${bucket}.s3.amazonaws.com/"
          } >> "${GITHUB_OUTPUT}"

          echo "Publishing ${TARGET_ENV} with bucket set ${version} to s3://${bucket}"
